# Build Pebble Tides and publish it to the repebble appstore whenever a
# GitHub Release is published.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   PEBBLE_FIREBASE_ID_TOKEN   a Pebble appstore auth token (see notes below)
# Optional repo variables:
#   PEBBLE_CATEGORY            appstore category key (defaults to "Tools")
#
# NOTE ON AUTH: Firebase ID tokens are short-lived (~1h), so a stored ID-token
# secret can go stale. If publishing fails with an auth error, switch to a
# refresh-token login: add a `pebble login --refresh-token "<token>"
# --firebase-api-key "<key>"` step before publish and store those as secrets.
#
# NOTE ON SDK: the first run downloads the SDK + ARM toolchain, which is slow.
# If `pip install pebble-tool` / `pebble sdk install` don't match the current
# Core Devices distribution, adjust those two steps.

name: Release to Pebble appstore

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Pebble tool
        run: pip install pebble-tool

      - name: Install Pebble SDK + toolchain
        run: pebble sdk install latest

      - name: Run JS unit tests
        run: node --test

      - name: Build .pbw
        run: pebble build

      - name: Attach .pbw to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/*.pbw --clobber

      - name: Authenticate with the appstore (refresh token)
        env:
          PEBBLE_REFRESH_TOKEN: ${{ secrets.PEBBLE_REFRESH_TOKEN }}
          PEBBLE_FIREBASE_API_KEY: ${{ secrets.PEBBLE_FIREBASE_API_KEY }}
        run: pebble login --refresh-token "$PEBBLE_REFRESH_TOKEN" --firebase-api-key "$PEBBLE_FIREBASE_API_KEY"

      - name: Publish to the repebble appstore
        env:
          PEBBLE_CATEGORY: ${{ vars.PEBBLE_CATEGORY || 'Tools' }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: ./scripts/publish.sh --is-published
